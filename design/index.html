<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Sans elle, le navigateur sonde `/design/favicon.ico` et la
             console de la page vitrine porte un 404 gratuit. -->
        <link rel="icon" href="../icons/icon-192.png" />
        <title>Etudes2Lignes — planche de référence</title>
    </head>
    <body>
        <!-- La planche n'importe **pas** `src/main.ts` : elle n'enregistre
             aucun service worker, ne s'installe pas, et ne touche à aucune
             donnée. Elle importe le système de design, et rien d'autre de
             l'application. -->
        <header class="planche-entete">
            <h1>Planche de référence</h1>
            <div class="planche-controles">
                <button type="button" data-apparence="light">Clair</button>
                <button type="button" data-apparence="dark">Sombre</button>
                <button type="button" data-apparence="auto">Système</button>
                <label><input type="checkbox" data-cibles /> Cibles de 44 px</label>
            </div>
        </header>
        <main id="planche"></main>
        <script type="module" src="./gallery.ts"></script>
    </body>
</html>
