<!--
  Le jeu de symboles de l'interface : un `<symbol>` par pictogramme.

  Il est posé une fois dans le document par `mountIcons`, et désigné soit par
  `createIcon` depuis le TypeScript, soit par un `<use href="#i-…">` écrit à la
  main dans un gabarit. Le second n'a pas de compilateur pour le surveiller :
  c'est `icons.test.ts` qui confronte tous les gabarits à ce fichier.

  **Aucun tracé ne porte de couleur**, et c'est la règle : la HIG demande des
  symboles monochromes sur le verre, qui s'assombrissent sur un fond clair et
  s'éclaircissent sur un fond sombre. Une couleur écrite ici les figerait —
  exactement ce que faisaient les emoji qu'ils remplacent.

  Épaisseur de trait, bouts et jointures arrondis, taille rendue : tout vient de
  la règle `.icon` de la feuille de style, rien n'est répété ici. Les deux seules
  formes que SF Symbols dessine pleines — la flèche de navigation et la lecture —
  portent `fill="currentColor" stroke="none"`, et c'est la seule exception.

  Grille de 24, comme SF Symbols.
-->
<svg id="jeu-de-symboles" xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <!-- Navigation, validation -->
    <symbol id="i-chevron-left" viewBox="0 0 24 24">
        <path d="M15 4.5 7.5 12l7.5 7.5" />
    </symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24">
        <path d="M4.5 15 12 7.5l7.5 7.5" />
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="M4.5 9 12 16.5 19.5 9" />
    </symbol>
    <symbol id="i-xmark" viewBox="0 0 24 24">
        <path d="M5.8 5.8 18.2 18.2M18.2 5.8 5.8 18.2" />
    </symbol>
    <symbol id="i-checkmark" viewBox="0 0 24 24">
        <path d="m4.8 12.8 4.7 4.7L19.2 6.5" />
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 4.8v14.4M4.8 12h14.4" />
    </symbol>
    <symbol id="i-arrow-clockwise" viewBox="0 0 24 24">
        <path d="M19.8 12a7.8 7.8 0 1 1-2.4-5.6" />
        <path d="M19.8 3.9v4.6h-4.6" />
    </symbol>

    <!-- Pages, points, carte -->
    <symbol id="i-photo" viewBox="0 0 24 24">
        <rect x="3.2" y="4.8" width="17.6" height="14.4" rx="3.2" />
        <path d="m4 17.2 4.2-4.2a2 2 0 0 1 2.8 0l3.4 3.4" />
        <path d="m13.4 15.4 1.4-1.4a2 2 0 0 1 2.8 0l2.4 2.4" />
        <circle cx="15.4" cy="9.2" r="1.4" />
    </symbol>
    <symbol id="i-map" viewBox="0 0 24 24">
        <path
            d="M9 4.4 4.1 6.3a1.4 1.4 0 0 0-.9 1.3v10.1c0 1 1 1.7 1.9 1.3L9 17.6l6 2 4.9-1.9a1.4 1.4 0 0 0 .9-1.3V6.3c0-1-1-1.7-1.9-1.3L15 6.4l-6-2Z"
        />
        <path d="M9 4.4v13.2M15 6.4v13.2" />
    </symbol>
    <symbol id="i-mappin" viewBox="0 0 24 24">
        <path d="M12 21.2s6.4-6 6.4-11a6.4 6.4 0 1 0-12.8 0c0 5 6.4 11 6.4 11Z" />
        <circle cx="12" cy="10" r="2.4" />
    </symbol>
    <!-- Déplacer un point sur l'image : seule sa hauteur change, et la flèche
         ne dit que cela. -->
    <symbol id="i-arrows-up-down" viewBox="0 0 24 24">
        <path d="M12 3.6v16.8" />
        <path d="M7.8 7.8 12 3.6l4.2 4.2M7.8 16.2 12 20.4l4.2-4.2" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 6.6h16" />
        <path d="M10.2 3.6h3.6a1.2 1.2 0 0 1 1.2 1.2v1.8H9V4.8a1.2 1.2 0 0 1 1.2-1.2Z" />
        <path d="m6.5 6.6.9 12.3a1.9 1.9 0 0 0 1.9 1.7h5.4a1.9 1.9 0 0 0 1.9-1.7l.9-12.3" />
        <path d="M10.4 10.4v6.4M13.6 10.4v6.4" />
    </symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="m3.8 20.2 1-4.2L16.2 4.6a2.6 2.6 0 0 1 3.7 3.7L8.5 19.7l-4.7.5Z" />
        <path d="m14.6 6.2 3.7 3.7" />
    </symbol>

    <!-- Position. « Ma position » recentre : la flèche est creuse. « Suivre »
         guide : la même flèche, pleine et posée sur sa route. -->
    <symbol id="i-location" viewBox="0 0 24 24">
        <path d="M20.4 3.6 4.2 10.1a.9.9 0 0 0 .1 1.7l6.4 1.6 1.6 6.4a.9.9 0 0 0 1.7.1Z" />
    </symbol>
    <symbol id="i-location-line" viewBox="0 0 24 24">
        <path
            d="M19.6 2.9 5.5 8.6a.9.9 0 0 0 .1 1.7l5.5 1.4 1.4 5.5a.9.9 0 0 0 1.7.1Z"
            fill="currentColor"
            stroke="none"
        />
        <path d="M3.6 20.6h16.8" />
    </symbol>

    <!-- Fichiers. La flèche monte pour sortir de l'application, descend pour y
         entrer : c'est la convention d'Apple, et l'inverse de celle que les
         emoji ⬆️/⬇️ portaient ici. -->
    <!-- Le plateau est **ouvert en haut** et la flèche s'arrête **au-dessus** de
         lui : 1,8 unité d'air les sépare. Sans cet écart, la pointe entrait dans
         la boîte, les deux formes se chevauchaient et la silhouette devenait
         illisible — on ne comprenait plus ce que le symbole désignait. -->
    <symbol id="i-square-arrow-up" viewBox="0 0 24 24">
        <path d="M12 12.4V3" />
        <path d="m8.4 6.6 3.6-3.6 3.6 3.6" />
        <path
            d="M7.4 14.2H6.2a2.4 2.4 0 0 0-2.4 2.4v3.4a2.4 2.4 0 0 0 2.4 2.4h11.6a2.4 2.4 0 0 0 2.4-2.4v-3.4a2.4 2.4 0 0 0-2.4-2.4h-1.2"
        />
    </symbol>
    <symbol id="i-square-arrow-down" viewBox="0 0 24 24">
        <path d="M12 3v9.4" />
        <path d="m8.4 8.8 3.6 3.6 3.6-3.6" />
        <path
            d="M7.4 14.2H6.2a2.4 2.4 0 0 0-2.4 2.4v3.4a2.4 2.4 0 0 0 2.4 2.4h11.6a2.4 2.4 0 0 0 2.4-2.4v-3.4a2.4 2.4 0 0 0-2.4-2.4h-1.2"
        />
    </symbol>
    <symbol id="i-arrow-down-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.6" />
        <path d="M12 7.6v8.8" />
        <path d="m8.4 12.8 3.6 3.6 3.6-3.6" />
    </symbol>

    <!-- Suivi -->
    <symbol id="i-play" viewBox="0 0 24 24">
        <path
            d="M8.2 5.3a.8.8 0 0 1 1.2-.7l9.4 6.7a.8.8 0 0 1 0 1.4l-9.4 6.7a.8.8 0 0 1-1.2-.7Z"
            fill="currentColor"
            stroke="none"
        />
    </symbol>
    <symbol id="i-flask" viewBox="0 0 24 24">
        <path d="M9.6 3.4v5.4l-4.7 8.9a2 2 0 0 0 1.8 3h10.6a2 2 0 0 0 1.8-3l-4.7-8.9V3.4" />
        <path d="M8 3.4h8" />
        <path d="M7.2 14.2h9.6" />
    </symbol>
    <!-- L'aperçu du trajet est un panneau qui vient se coller au bord droit :
         le symbole dit où il paraît, pas ce qu'il montre. -->
    <symbol id="i-sidebar-trailing" viewBox="0 0 24 24">
        <rect x="3.4" y="4.4" width="17.2" height="15.2" rx="2.8" />
        <path d="M15.4 4.4v15.2" />
    </symbol>
</svg>
