<style>
    /* Un custom element est `inline` par défaut. Sans ce `block`, la boîte
       mesurée par l'écran de suivi ne serait pas celle de l'image, et tous les
       offsets du défilement seraient faux. */
    :host {
        display: block;
    }

    /* La décoration (bordure de l'éditeur) reste dehors, sur l'hôte : ici vit
       la seule géométrie, que les deux écrans partagent. */
    img {
        display: block;
        width: 100%;
        height: auto;
        /* Précaution, pas mesure : certaines versions de WebKit ignorent
           `draggable="false"` seul sur une image. Des lancements répétés du
           scénario de glisser (e2e/points.spec.ts) sur `webkit` se sont
           montrés sensibles à la façon de les enchaîner dans cet
           environnement — trop bruité pour isoler cette ligne à elle seule —
           donc gardée par défense plutôt que retirée sans certitude. */
        -webkit-user-drag: none;
    }
</style>
<!-- Une image est glissable nativement par défaut : sans `draggable="false"`,
     saisir la pastille d'un point posée dessus et bouger la souris fait
     démarrer le glisser natif de l'image, que le navigateur annonce par un
     `pointercancel` — le geste de `glisserUnPointSurLaPile` s'arrête net, quel
     que soit l'élément qui a reçu le `pointerdown`. -->
<img alt="" loading="lazy" decoding="async" draggable="false" />
