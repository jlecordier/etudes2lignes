<!-- Le nom du trajet est le titre cliquable de la ligne, pas une action
     secondaire : son nom accessible est le nom du trajet, tout court. Il occupe
     sa propre ligne, en pleine largeur — partagée avec le compte, il se cassait
     en deux sur un téléphone. -->
<button class="trajet-name" type="button"></button>
<!-- Le compte et les actions se partagent la seconde ligne. Empilées, les trois
     actions prenaient la moitié de la hauteur de la carte, soit plus que le
     trajet lui-même. -->
<div class="trajet-footer">
    <span class="trajet-details"></span>
</div>
