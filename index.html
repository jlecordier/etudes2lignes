<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1d4ed8" />
        <link rel="icon" href="./icons/icon-192.png" />
        <title>Etudes2Lignes — Suivi de schémas de ligne</title>
    </head>
    <body>
        <!-- Les écrans se montent ici : en attacher un détache le précédent, ce
             qui suffit à le ranger. Leur balisage vit dans le fichier .html de
             chaque écran, à côté de son .ts. -->
        <main id="app"></main>

        <!-- L'indicateur parle de l'application, pas d'un écran : il reste donc
             dans la coquille, où le service worker peut l'allumer quel que soit
             l'écran monté à ce moment-là. -->
        <p id="offline-indicator" class="offline-indicator" hidden>
            ✓ Application disponible hors ligne
        </p>

        <!-- Superposition, pas un écran : elle se pose par-dessus l'écran courant,
             qui reste visible dessous. Elle ne porte donc pas la classe « ecran »
             et ne peut pas être masquée par la navigation. -->
        <section id="screen-carte" class="screen-carte" hidden>
            <div id="carte-container"></div>
            <div class="carte-bar">
                <input
                    id="latitude-input"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Latitude"
                    aria-label="Latitude"
                />
                <input
                    id="longitude-input"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Longitude"
                    aria-label="Longitude"
                />
                <button id="manual-place-button" type="button" class="secondary">📌 Placer</button>
                <button id="cancel-carte-button" type="button" class="secondary">✖️ Annuler</button>
                <button id="confirm-carte-button" type="button" disabled>✅ Valider</button>
            </div>
        </section>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
