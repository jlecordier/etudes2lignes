<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <!-- Non zoomable : les gestes que le pincement et le double-tap
             occupaient servent à poser un point sur le schéma. Honoré par
             Android ; Safari iOS l'ignore depuis iOS 10, et c'est
             `src/shared/pinchZoom.ts` qui s'en charge là-bas. -->
        <!-- `viewport-fit=cover` est la condition d'existence des `env(safe-area-inset-*)` :
             sans lui ces fonctions valent **0px**, et une barre en verre posée
             au bord tombe sous l'encoche ou sous la barre d'accueil. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <!-- Deux déclarations, une par apparence : c'est la couleur que le
             système donne à *sa* barre autour de la page. Elles reprennent les
             fonds de la feuille (`--fond-groupe`), et non une teinte d'accent —
             une barre bleue au-dessus d'un contenu clair annonce une couleur que
             l'interface ne porte plus nulle part. -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
        <!-- Le favicon, et sa variante sombre. Le web n'a pas les variantes
             d'apparence d'iOS — un manifeste ne déclare qu'un jeu d'icônes —
             mais `media` sur un `rel="icon"` en tient lieu pour l'onglet.
             L'ordre compte : le clair vient sans condition, donc un moteur qui
             ignore `media` le garde, et celui qui l'honore laisse le sombre
             écraser le premier quand il correspond. -->
        <link rel="icon" href="./icons/icon-192.png" />
        <link rel="icon" href="./icons/icon-192-sombre.png" media="(prefers-color-scheme: dark)" />
        <!-- Ce qu'iOS lit à l'ajout sur l'écran d'accueil. Il manquait : sans
             lui, Safari fabriquait sa propre vignette à partir de la page. -->
        <link rel="apple-touch-icon" href="./icons/icon-512.png" />
        <title>Etudes2Lignes — Suivi de schémas de ligne</title>
    </head>
    <body>
        <!-- Les écrans se montent ici : en attacher un détache le précédent, ce
             qui suffit à le ranger. Leur balisage vit dans le fichier .html de
             chaque écran, à côté de son .ts. -->
        <main id="app"></main>

        <!-- L'indicateur parle de l'application, pas d'un écran : il reste donc
             dans la coquille, où le service worker peut l'allumer quel que soit
             l'écran monté à ce moment-là. -->
        <p id="offline-indicator" class="offline-indicator" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-arrow-down-circle" /></svg>
            Application disponible hors ligne
        </p>

        <!-- Superposition, pas un écran : elle se pose par-dessus l'écran courant,
             qui reste visible dessous. Elle ne porte donc pas la classe « ecran »
             et ne peut pas être masquée par la navigation. -->
        <section id="screen-carte" class="screen-carte" hidden>
            <div id="carte-container"></div>
            <div class="carte-bar">
                <p id="carte-position-status" class="carte-position-status" hidden></p>
                <input
                    id="latitude-input"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Latitude"
                    aria-label="Latitude"
                />
                <input
                    id="longitude-input"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Longitude"
                    aria-label="Longitude"
                />
                <button
                    id="manual-place-button"
                    type="button"
                    class="secondary"
                    aria-label="Placer"
                >
                    <svg class="icon" aria-hidden="true"><use href="#i-mappin" /></svg>
                    <span class="button-label">Placer</span>
                </button>
                <!-- « Ma position » n'est plus ici : l'adapter le pose **sur** la
                     carte, en contrôle Leaflet, là où la plateforme le met — et
                     il tenait déjà la coordonnée à rejoindre. -->
                <button
                    id="cancel-carte-button"
                    type="button"
                    class="secondary"
                    aria-label="Annuler"
                >
                    <svg class="icon" aria-hidden="true"><use href="#i-xmark" /></svg>
                    <span class="button-label">Annuler</span>
                </button>
                <button id="confirm-carte-button" type="button" disabled aria-label="Valider">
                    <svg class="icon" aria-hidden="true"><use href="#i-checkmark" /></svg>
                    <span class="button-label">Valider</span>
                </button>
            </div>
        </section>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
