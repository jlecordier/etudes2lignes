<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1d4ed8" />
        <link rel="icon" href="./icons/icon-192.png" />
        <title>Etudes2Lignes — Suivi de schémas de ligne</title>
    </head>
    <body>
        <!-- Les écrans-éléments se montent ici : en attacher un détache le
             précédent, ce qui suffit à le ranger. Les <section> ci-dessous sont
             les écrans pas encore convertis. -->
        <main id="app"></main>

        <section id="screen-list" class="screen">
            <header class="header">
                <h1>Mes trajets</h1>
                <div class="action-bar">
                    <button id="import-trajet-button" type="button" class="secondary">
                        ⬆️ Importer
                    </button>
                    <button id="create-trajet-button" type="button">🆕 Nouveau trajet</button>
                </div>
            </header>
            <input id="input-import-trajet" type="file" accept="application/json,.json" hidden />
            <ul id="trajets-list" class="trajets-list"></ul>
            <p id="empty-list" class="empty-message" hidden>
                Aucun trajet pour l'instant. Créez-en un, puis importez les pages (images) de votre
                schéma de ligne.
            </p>
            <p id="offline-indicator" class="offline-indicator" hidden>
                ✓ Application disponible hors ligne
            </p>
        </section>

        <!-- Superposition, pas un écran : elle se pose par-dessus l'écran courant,
             qui reste visible dessous. Elle ne porte donc pas la classe « ecran »
             et ne peut pas être masquée par la navigation. -->
        <section id="screen-carte" class="screen-carte" hidden>
            <div id="carte-container"></div>
            <div class="carte-bar">
                <input
                    id="latitude-input"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Latitude"
                    aria-label="Latitude"
                />
                <input
                    id="longitude-input"
                    type="number"
                    step="any"
                    inputmode="decimal"
                    placeholder="Longitude"
                    aria-label="Longitude"
                />
                <button id="manual-place-button" type="button" class="secondary">📌 Placer</button>
                <button id="cancel-carte-button" type="button" class="secondary">✖️ Annuler</button>
                <button id="confirm-carte-button" type="button" disabled>✅ Valider</button>
            </div>
        </section>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
